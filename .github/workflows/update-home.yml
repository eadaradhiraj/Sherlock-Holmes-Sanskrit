name: Update home page

on:
  push:
    branches: [main]
    paths:
      - "adventures-sherlock-holmes/**"
      - "memoirs/**"
      - "scripts/update_home.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate index.html
        run: python3 scripts/update_home.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html up to date, nothing to commit."
            exit 0
          fi
          # remove legacy home.html if it reappears
          if [ -f home.html ]; then git rm -f home.html || rm -f home.html; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # stage deletion of home.html if tracked
          git rm --cached home.html 2>/dev/null || true
          git commit -m "chore: auto-update index.html [skip ci]"
          git push
